server.port=8080
spring.application.name=campuspulse-attendance

# Local In-Memory PostgreSQL Emulation Profile
spring.datasource.url=jdbc:h2:mem:campuspulse_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for in-memory emulation; DataInitializer will seed schema and data
spring.flyway.enabled=false

# Security & JWT
campuspulse.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
campuspulse.jwt.expiration-ms=86400000

# CORS
campuspulse.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000
