server.port=8080
spring.application.name=campuspulse-attendance

# PostgreSQL / Neon Cloud Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://ep-divine-bread-b3mmmh8w-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:neondb_owner}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:npg_rFlKP27scLQb}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings optimized for Neon Serverless
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA & Hibernate Schema Auto-generation
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Migrations (Hibernate ddl-auto manages schema generation)
spring.flyway.enabled=false

# JWT Secret Configuration (256-bit secure key)
campuspulse.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
campuspulse.jwt.expiration-ms=86400000

# CORS (Configurable via CORS_ALLOWED_ORIGINS environment variable for subdomain deployment)
campuspulse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:3000,https://campus-attendance-chi.vercel.app,https://*.vercel.app}

